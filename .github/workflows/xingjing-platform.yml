name: Xingjing Platform

on:
  pull_request:
  push:
    branches:
      - xingjing/platform-main

permissions:
  contents: read

jobs:
  product-baseline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify v9.2 product baseline
        shell: pwsh
        run: .\scripts\Test-ProductBaseline.ps1

  platform-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run platform tests
        run: ./gradlew test
      - name: Build platform application
        run: ./gradlew :platform-services:platform-app:bootJar
      - name: Upload platform application
        uses: actions/upload-artifact@v7
        with:
          name: xingjing-platform-app
          path: platform-services/platform-app/build/libs/*.jar
