  /workspaces/{workspaceId}/review-links:
    get:
      tags: [Review]
      summary: list Workspace Review Links
      operationId: listWorkspaceReviewLinks
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/PageToken'}
      responses:
        '400': {$ref: '#/components/responses/ValidationError'}
        '200': {$ref: '#/components/responses/ListResponse'}
    post:
      tags: [Review]
      summary: create Workspace Review Link
      operationId: createWorkspaceReviewLink
      security: [{bearerAuth: []}]
      parameters:
