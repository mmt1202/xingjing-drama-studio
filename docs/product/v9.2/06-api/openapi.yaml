openapi: 3.1.0
info:
  title: Xingjing Drama Studio API
  version: 9.2.0-spec.1
  description: 星镜剧创 v9.2 四端 Web 开发契约。所有租户接口均需服务端校验工作区和对象归属。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
tags:
  - name: Session
    description: 会话、当前工作区和能力上下文
  - name: Account
    description: 账号、安全与偏好
  - name: Workspace
    description: 工作区、成员、角色和企业资料
  - name: Project
    description: 项目、剧集、状态与项目配置
  - name: Script
    description: 剧本、解析、改写与版本
  - name: Asset
    description: 角色、场景、道具和主体资产
  - name: Shot
    description: 分镜、故事板和提示词
  - name: Generation
    description: 长任务、模型调用和生成结果
  - name: Audio
    description: 配音、字幕、音效和对口型
  - name: Timeline
    description: 时间线、成片和渲染
  - name: Review
    description: 团队和客户审片
  - name: Export
    description: 导出任务和发布包
  - name: Billing
    description: 算力账户、流水和成本
  - name: Compliance
    description: 合规检查、授权和风险处置
  - name: Template
    description: 模板创建、审核和应用
  - name: Market
    description: 市场与 Fork
  - name: Commercial
    description: 商单生产、验收和结算
  - name: Analytics
    description: 业务指标和数据看板
  - name: Admin
    description: 平台运营后台聚合接口
paths:
  /session/context:
    get:
      tags: [Session]
      summary: get Session Context
      operationId: getSessionContext
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: 当前用户、工作区、角色和功能开关
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionContextResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /account/profile:
    get:
      tags: [Account]
      summary: get Account Profile
      operationId: getAccountProfile
      security: [{bearerAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/ObjectResponse'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
  /account/preferences:
    get:
      tags: [Account]
      summary: get Account Preferences
      operationId: getAccountPreferences
      security: [{bearerAuth: []}]
      responses:
        '400': {$ref: '#/components/responses/ValidationError'}
        '200': {$ref: '#/components/responses/ObjectResponse'}
    put:
      tags: [Account]
      summary: update Account Preferences
      operationId: updateAccountPreferences
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/EntityRequest'}
      responses:
        '200': {$ref: '#/components/responses/ObjectResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /auth/actions:
    post:
      tags: [Account]
      summary: execute Auth Action
      operationId: executeAuthAction
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [changePassword, revokeSession, enableMfa, disableMfa, requestAccountCancel, confirmAccountCancel]}
                payload: {type: object, additionalProperties: true}
      responses:
        '200': {$ref: '#/components/responses/ObjectResponse'}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
  /workspaces/{workspaceId}:
    get:
      tags: [Workspace]
      summary: get Workspace
      operationId: getWorkspace
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}]
      responses:
        '200': {$ref: '#/components/responses/ObjectResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /workspaces/{workspaceId}/overview:
