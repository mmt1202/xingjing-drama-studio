      responses:
        '400': {$ref: '#/components/responses/ValidationError'}
        '200': {$ref: '#/components/responses/ListResponse'}
    post:
      tags: [Template]
      summary: create Template
      operationId: createTemplate
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/EntityRequest'}
      responses:
        '400': {$ref: '#/components/responses/ValidationError'}
        '201': {$ref: '#/components/responses/ObjectResponse'}
  /templates/actions:
    post:
      tags: [Template]
      summary: execute Template Action
      operationId: executeTemplateAction
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/ActionRequest'}
      responses:
        '400': {$ref: '#/components/responses/ValidationError'}
        '200': {$ref: '#/components/responses/ObjectResponse'}
  /market/items:
    get:
      tags: [Market]
      summary: list Market Items
      operationId: listMarketItems
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/PageToken'}
      responses:
        '400': {$ref: '#/components/responses/ValidationError'}
        '200': {$ref: '#/components/responses/ListResponse'}
  /forks:
    post:
      tags: [Market]
      summary: create Fork
      operationId: createFork
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/EntityRequest'}
      responses:
        '202': {$ref: '#/components/responses/ObjectResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /commercial-orders:
    get:
      tags: [Commercial]
      summary: list Commercial Orders
      operationId: listCommercialOrders
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/PageToken'}
      responses:
        '400': {$ref: '#/components/responses/ValidationError'}
        '200': {$ref: '#/components/responses/ListResponse'}
  /commercial-orders/{orderId}/actions:
    post:
      tags: [Commercial]
      summary: execute Commercial Order Action
      operationId: executeCommercialOrderAction
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/OrderId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/ActionRequest'}
      responses:
        '200': {$ref: '#/components/responses/ObjectResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /analytics/dashboards/{dashboardKey}:
    get:
      tags: [Analytics]
      summary: get Analytics Dashboard
      operationId: getAnalyticsDashboard
      security: [{bearerAuth: []}]
      parameters:
        - name: dashboardKey
          in: path
          required: true
          schema: {type: string}
      responses:
        '400': {$ref: '#/components/responses/ValidationError'}
        '200': {$ref: '#/components/responses/ObjectResponse'}
  /admin/{resource}:
    get:
      tags: [Admin]
      summary: list Admin Resources
      operationId: listAdminResources
      security: [{adminSession: []}]
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [models, finance, compliance, commercial-orders, operations, security, support-tickets, notifications, api-clients, operations-config, business-objects]
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/PageToken'}
      responses:
        '200': {$ref: '#/components/responses/ListResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/{resource}/actions:
    post:
      tags: [Admin]
      summary: execute Admin Resource Action
      operationId: executeAdminResourceAction
      security: [{adminSession: []}]
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/ActionRequest'}
      responses:
        '200': {$ref: '#/components/responses/ObjectResponse'}
        '202': {$ref: '#/components/responses/ObjectResponse'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminSession:
      type: apiKey
      in: cookie
      name: xj_admin_session
    reviewToken:
      type: apiKey
      in: cookie
      name: xj_review_session
  parameters:
    WorkspaceHeader:
      name: X-Workspace-Id
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    RoleId:
      name: roleId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    OrderId:
      name: orderId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Uuid'}
    ReviewToken:
      name: token
      in: path
      required: true
      schema: {type: string, minLength: 32, maxLength: 256}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"[0-9]+"$'}
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    PageToken:
      name: pageToken
      in: query
      required: false
      schema: {type: string, maxLength: 2048}
  requestBodies:
    ActionRequest:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ActionRequest'}
    EntityRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    ObjectResponse:
      description: 单对象成功响应
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ObjectResponse'}
    ListResponse:
      description: 游标分页列表响应
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ListResponse'}
    ValidationError:
      description: 请求字段不合法
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthenticated:
      description: 未认证
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: 资源不存在或不可见
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Gone:
      description: 资源已撤销或永久不可用
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: 版本、状态、计费、幂等或合规冲突
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    Uuid:
      type: string
      format: uuid
    Meta:
      type: object
      required: [requestId]
      properties:
        requestId: {$ref: '#/components/schemas/Uuid'}
        serverTime: {type: string, format: date-time}
        page:
          type: object
          properties:
            size: {type: integer}
            nextToken: {type: [string, 'null']}
    ObjectResponse:
      type: object
      required: [data, meta]
      properties:
        data: {type: object, additionalProperties: true}
        meta: {$ref: '#/components/schemas/Meta'}
    ListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {type: object, additionalProperties: true}
        meta: {$ref: '#/components/schemas/Meta'}
    ErrorDetail:
      type: object
      properties:
        field: {type: string}
        reason: {type: string}
    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
            details:
              type: array
              items: {$ref: '#/components/schemas/ErrorDetail'}
        meta: {$ref: '#/components/schemas/Meta'}
    SessionContextResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [user, workspaces]
          properties:
            user: {type: object, additionalProperties: true}
            activeWorkspace: {type: [object, 'null'], additionalProperties: true}
            workspaces: {type: array, items: {type: object, additionalProperties: true}}
            permissions: {type: array, items: {type: string}}
            featureFlags: {type: object, additionalProperties: true}
        meta: {$ref: '#/components/schemas/Meta'}
    ActionRequest:
      type: object
      required: [action]
      properties:
        action: {type: string, minLength: 1, maxLength: 80}
        targetId: {$ref: '#/components/schemas/Uuid'}
        payload: {type: object, additionalProperties: true}
    CreateProjectRequest:
      type: object
      required: [name, projectType, narrativeMode, targetPlatforms, aspectRatio, qualityMode]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        projectType: {type: string, enum: [aiComicDrama, aiLiveAction, narratedDrama, motionComic, brandAd]}
        narrativeMode: {type: string, enum: [narration, dialogue, mixed]}
        targetPlatforms: {type: array, minItems: 1, uniqueItems: true, items: {type: string}}
        aspectRatio: {type: string, enum: ['9:16', '16:9', '1:1', '4:3', '3:4']}
        stylePreset: {type: string, maxLength: 80}
        qualityMode: {type: string, enum: [draft, standard, premium]}
        budgetCap: {type: integer, format: int64, minimum: 0}
        episodeCount: {type: integer, minimum: 1, maximum: 500}
        durationTargetMs: {type: integer, format: int64, minimum: 1000}
    CreateGenerationTaskRequest:
      type: object
      required: [projectId, taskType, input, qualityMode]
      properties:
        projectId: {$ref: '#/components/schemas/Uuid'}
        episodeId: {$ref: '#/components/schemas/Uuid'}
        shotId: {$ref: '#/components/schemas/Uuid'}
        taskType:
          type: string
          enum: [scriptAnalyze, directorGenerate, subjectExtract, imageGenerate, videoGenerate, tts, subtitle, lipSync, enhance, render, export, complianceCheck]
        input: {type: object, additionalProperties: true}
        qualityMode: {type: string, enum: [draft, standard, premium]}
        budgetLimit: {type: integer, format: int64, minimum: 0}
        preferredModelId: {$ref: '#/components/schemas/Uuid'}
    TaskResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [taskId, status, progress]
          properties:
            taskId: {$ref: '#/components/schemas/Uuid'}
            status: {type: string, enum: [pending, queued, running, success, failed, retrying, cancelled, timeout, settlementPending]}
            progress: {type: integer, minimum: 0, maximum: 100}
            estimatedCredit: {type: integer, format: int64, minimum: 0}
            actualCredit: {type: integer, format: int64, minimum: 0}
            failureCode: {type: [string, 'null']}
        meta: {$ref: '#/components/schemas/Meta'}
