      summary: execute Workspace Action
      operationId: executeWorkspaceAction
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {$ref: '#/components/requestBodies/ActionRequest'}
